[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501", "B905", "E402", "F841", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "services"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]
reportMissingImports = false
reportMissingTypeStubs = false
pythonVersion = "3.10"
