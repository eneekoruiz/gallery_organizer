<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - SmartGallery Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0b0c0e;
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .share-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(18, 19, 24, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .share-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .share-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0a84ff;
            box-shadow: 0 0 15px rgba(10, 132, 255, 0.4);
        }

        .share-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #ffffff;
        }

        .share-subtitle {
            font-size: 0.82rem;
            color: #8e8e93;
            margin-top: 2px;
        }

        .download-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #30d158;
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 22px;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(48, 209, 88, 0.35);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            cursor: pointer;
        }

        .download-all-btn:hover {
            background: #34c759;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(48, 209, 88, 0.5);
        }

        .download-all-btn:active {
            transform: translateY(0);
        }

        /* GRID */
        .grid-wrapper {
            flex: 1;
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        @media (max-width: 600px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
            .share-header {
                padding: 12px 16px;
            }
            .grid-wrapper {
                padding: 12px;
            }
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .photo-card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* MODAL VIEWER */
        .viewer-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .viewer-content {
            position: relative;
            max-width: 90vw;
            max-height: 82vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-content img, .viewer-content video {
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .viewer-toolbar {
            position: absolute;
            top: 16px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .viewer-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .viewer-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="share-header">
        <div class="share-brand">
            {% if avatar_url %}
            <img src="{{ avatar_url }}" alt="{{ title }}" class="share-avatar">
            {% endif %}
            <div>
                <h1 class="share-title">{{ title }}</h1>
                <p class="share-subtitle">{{ photos|length }} fotos y vídeos disponibles</p>
            </div>
        </div>

        <a href="/api/export/zip?cat={{ category|urlencode }}&ident={{ identity|urlencode }}" class="download-all-btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Descargar Todo en ZIP</span>
        </a>
    </header>

    <!-- Photo Grid -->
    <main class="grid-wrapper">
        <div class="photo-grid">
            {% for item in photos %}
            <div class="photo-card" onclick="openShareViewer({{ loop.index0 }})">
                <img src="/api/thumbnail?path={{ item.path|urlencode }}" loading="lazy" decoding="async" alt="{{ item.name }}">
                {% if item.type == 'video' %}
                <div class="video-badge">▶ Vídeo</div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- Modal Viewer -->
    <div id="share-viewer" class="viewer-modal">
        <div class="viewer-toolbar">
            <button class="viewer-btn" onclick="closeShareViewer()">✕ Cerrar</button>
            <a id="btn-single-download" class="viewer-btn" href="#" download style="background:#0a84ff; border-color:#0a84ff;">
                ⬇️ Descargar esta foto
            </a>
        </div>

        <button class="nav-btn nav-prev" onclick="prevSharePhoto()">‹</button>
        
        <div class="viewer-content" id="viewer-media-box">
            <!-- Media injected by JS -->
        </div>

        <button class="nav-btn nav-next" onclick="nextSharePhoto()">›</button>
    </div>

    <script>
        const photos = {{ photos|tojson }};
        let currentIndex = 0;

        function openShareViewer(index) {
            currentIndex = index;
            const item = photos[currentIndex];
            const modal = document.getElementById('share-viewer');
            const mediaBox = document.getElementById('viewer-media-box');
            const dlBtn = document.getElementById('btn-single-download');

            mediaBox.innerHTML = '';
            const mediaUrl = `/media?path=${encodeURIComponent(item.path)}`;
            dlBtn.href = mediaUrl;
            dlBtn.setAttribute('download', item.name);

            if (item.type === 'video') {
                const vid = document.createElement('video');
                vid.src = mediaUrl;
                vid.controls = true;
                vid.autoplay = true;
                vid.playsInline = true;
                mediaBox.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = mediaUrl;
                mediaBox.appendChild(img);
            }

            modal.style.display = 'flex';
        }

        function closeShareViewer() {
            const modal = document.getElementById('share-viewer');
            const mediaBox = document.getElementById('viewer-media-box');
            mediaBox.innerHTML = '';
            modal.style.display = 'none';
        }

        function prevSharePhoto() {
            if (photos.length === 0) return;
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            openShareViewer(currentIndex);
        }

        function nextSharePhoto() {
            if (photos.length === 0) return;
            currentIndex = (currentIndex + 1) % photos.length;
            openShareViewer(currentIndex);
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('share-viewer').style.display === 'flex') {
                if (e.key === 'Escape') closeShareViewer();
                else if (e.key === 'ArrowLeft') prevSharePhoto();
                else if (e.key === 'ArrowRight') nextSharePhoto();
            }
        });
    </script>
</body>
</html>
