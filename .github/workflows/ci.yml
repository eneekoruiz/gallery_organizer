name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest
          if [ -f smart_gallery_v2/requirements.txt ]; then pip install -r smart_gallery_v2/requirements.txt; fi
          
      - name: Lint with ruff
        run: ruff check smart_gallery_v2
        
      - name: Check formatting with black
        run: black --check smart_gallery_v2
        
      - name: Run tests
        run: |
          cd smart_gallery_v2
          pytest
