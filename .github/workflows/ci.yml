name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f smart_gallery_v2/requirements.txt ]; then pip install -r smart_gallery_v2/requirements.txt; fi

      - name: Compile Code
        run: |
          python -m compileall smart_gallery_v2

      - name: Lint Code with Ruff
        run: |
          ruff check smart_gallery_v2

      - name: Check Format with Black
        run: |
          black --check smart_gallery_v2

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          cd smart_gallery_v2 && pytest -q
