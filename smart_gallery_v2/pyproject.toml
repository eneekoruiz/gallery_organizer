[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501", "B905", "E402", "F841", "W291"] # ignore length, zip, imports order, unused, whitespace

[tool.ruff.isort]
known-first-party = ["core", "ui", "services"]
